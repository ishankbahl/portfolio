name: ci

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first. Nothing here needs the
# older run to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned node version
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Off because it defaults on, and when it is on this action looks for
          # pnpm to configure caching before corepack has provided it, which
          # fails the step. Caching 440 packages on a project this size is not
          # worth a third party action to work around the ordering.
          package-manager-cache: false

      # pnpm comes from the packageManager field, so the version is pinned by
      # the repo rather than by whatever this runner happens to ship.
      - name: Enable pnpm through corepack
        run: |
          corepack enable pnpm
          corepack install
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Application javascript budget
        run: pnpm budget

      - name: Contrast ratios
        run: pnpm contrast

      # Chromium only. The suite declares one project and pulling the other two
      # browsers would be a minute of download for nothing.
      - name: Install chromium for playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: End to end tests
        run: pnpm test:e2e

      - name: Upload the playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
